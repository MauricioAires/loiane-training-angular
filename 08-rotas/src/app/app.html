<header class="bg-gray-900">
  <nav aria-label="Global" class="mx-auto flex items-center justify-between lg:px-8">
    <div class="flex lg:flex-1">
      <a routerLink="/" class="-m-1.5 p-1.5">
        <img
          src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=indigo&shade=500"
          alt=""
          class="h-8 w-auto"
        />
      </a>
    </div>

    <div class="flex flex-row gap-10 text-white">
      <a
        routerLink="/courses"
        [queryParams]="{ pagina: 1 }"
        routerLinkActive="text-blue-300"
        class="text-sm/6 font-semibold"
        >Courses</a
      >
      <a
        [routerLink]="['course', courseId()]"
        routerLinkActive="text-blue-300"
        class="text-sm/6 font-semibold"
        >Course with ID</a
      >
      <a routerLinkActive="text-blue-300" routerLink="/login" class="text-sm/6 font-semibold"
        >Login</a
      >
    </div>
  </nav>
</header>

<div class="px-2">
  <p>Entre com o id do curso</p>
  <input
    placeholder="ID do curso"
    class="bg-gray-400 w-full px-2 h-8 border-1 rounded-sm"
    type="text"
    (input)="courseId.set($event.target.value)"
  />
  <!--
  As várias locais mudaram com a implementação do zoneless

  a partir do angular v21 antes o angular escurava eventos
  como input e outras coisas agora ele só atualiza com

  signal/markForCheck

  -->
  <router-outlet />
</div>
