<p class="font-bold text-xl mb-4">Criar/Editar Aluno</p>

<div class="flex flex-col bg-gray-200 p-3 gap-5">
  <div class="w-full">
    <label for="username" class="block text-sm/6 font-medium text-gray-700">ID</label>
    <div class="mt-2">
      <div
        class="flex items-center px-2 rounded-md bg-white outline-1 outline-white/10 focus-within:outline-2 focus-within:outline-indigo-500"
      >
        <input
          id="username"
          type="text"
          name="username"
          [(ngModel)]="student().id"
          placeholder="ID"
          autocomplete="off"
          class="block min-w-0 grow bg-white py-1.5 pr-3 pl-1 text-base text-gray-700 placeholder:text-gray-500 focus:outline-none sm:text-sm/6"
        />
      </div>
    </div>
  </div>

  <div class="flex-1">
    <div class="sm:col-span-4">
      <label for="username" class="block text-sm/6 font-medium text-gray-700">Nome</label>
      <div class="mt-2">
        <div
          class="flex items-center rounded-md bg-white pl-3 outline-1 -outline-offset-1 outline-white/10 focus-within:outline-2 focus-within:outline-indigo-500"
        >
          <input
            id="username"
            type="text"
            name="username"
            [(ngModel)]="student().name"
            autocomplete="name"
            placeholder="Nome"
            class="block min-w-0 grow bg-white py-1.5 pr-3 pl-1 text-base text-gray-700 placeholder:text-gray-500 focus:outline-none sm:text-sm/6"
          />
        </div>
      </div>
    </div>
  </div>
  <div class="flex-1">
    <div class="sm:col-span-4">
      <label for="username" class="block text-sm/6 font-medium text-gray-700">E-mail</label>
      <div class="mt-2">
        <div
          class="flex items-center rounded-md bg-white pl-3 outline-1 -outline-offset-1 outline-white/10 focus-within:outline-2 focus-within:outline-indigo-500"
        >
          <input
            id="username"
            type="text"
            name="username"
            [(ngModel)]="student().email"
            autocomplete="email"
            placeholder="E-mail"
            class="block min-w-0 grow bg-white py-1.5 pr-3 pl-1 text-base text-gray-700 placeholder:text-gray-500 focus:outline-none sm:text-sm/6"
          />
        </div>
      </div>
    </div>
  </div>
</div>
