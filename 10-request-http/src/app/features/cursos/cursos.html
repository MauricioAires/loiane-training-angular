<div class="card mt-3">
  <div class="card-header d-flex justify-content-between align-items-center">
    <div class="float-left">
      <h4>Cursos</h4>
    </div>
    <div class="float-right">
      <button type="button" class="btn btn-primary" [routerLink]="['novo']">Novo Curso</button>
    </div>
  </div>

  <div class="card-body">
    @if (cursos$ | async; as innerCursos) {
      <table class="table table-hover">
        <thead>
          <tr>
            <th>#</th>
            <th>Curso</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          @for (curso of innerCursos; track curso.id) {
            <tr>
              <td>
                {{ curso.id }}
              </td>
              <td>
                {{ curso.nome }}
              </td>
              <td>
                <div class="d-flex gap-2 align-items-end justify-content-end">
                  <button type="button" class="btn btn-outline-warning mb-1 btn-sm">
                    Atualizar
                  </button>

                  <button type="button" class="btn btn-outline-danger mb-1 btn-sm">Remover</button>
                </div>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="3">
                <p>Nada ainda</p>
              </td>
            </tr>
          }
        </tbody>
      </table>
    } @else {
      <span> Carregando cursos... </span>
    }
  </div>
</div>
