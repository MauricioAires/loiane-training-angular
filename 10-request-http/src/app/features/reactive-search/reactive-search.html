<div class="mt-3">
  <div class="container search-table">
    <div class="search-box">
      <div class="d-flex flex-row justify-content-between gap-3">
        <div class="col-md-10">
          <input
            type="text"
            class="form-control"
            placeholder="Pesquisar libs"
            [formControl]="queryField"
          />
        </div>
        <div class="col-md-2">
          <button class="btn btn-success" type="button" (click)="onSearch()">Pesquisar</button>
        </div>
      </div>
    </div>
    <div class="search-list">
      <h3>{{ total() }} Registros encontrados</h3>
      <table class="table" id="myTable">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Versão</th>
          </tr>
        </thead>
        <tbody>
          @for (item of results$ | async; track $index) {
            <tr>
              <td>{{ item.name }}</td>
              <td>{{ item.version }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
