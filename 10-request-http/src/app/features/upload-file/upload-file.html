<div class="mt-4">
  <div class="mb-3">
    <input class="form-control" type="file" id="formFile" multiple (change)="onChange($event)" />
  </div>

  <div class="progress">
    <div
      class="progress-bar"
      role="progressbar"
      [style.width.%]="progress()"
      [aria-valuenow]="progress()"
      aria-valuemin="0"
      aria-valuemax="100"
    >
      {{ progress() }}%
    </div>
  </div>
</div>

<div class="mt-3">
  <button type="button" class="btn btn-primary" (click)="onUpload()" [disabled]="!hasSelectFiles()">
    Upload
  </button>
</div>
