<div class="form-group has-validation mb-3">
  <div class="col-sm-12">
    <label for="{{ id() }}" class="form-label">{{ label() }}</label>
  </div>
  <div class="col-sm-12">
    <input
      [type]="inputTipo()"
      [placeholder]="label()"
      class="form-control"
      [id]="id()"
      [name]="id()"
      [ngClass]="classeCss()"
      [readOnly]="!!isReadOnly()"
      [(ngModel)]="value"
      (blur)="onTouchedCb()"
    />

    <div app-error-msg [control]="control()" [label]="label()"></div>
  </div>
</div>
