<div class="bg-secondary-subtle p-4">
  <form #form="ngForm" (ngSubmit)="onSubmit(form)">
    @let hasNameError = !name.valid && name.touched;

    <div class="form-group has-validation mb-3">
      <label for="email" class="form-label">Name</label>
      <input
        type="text"
        placeholder="Name"
        class="form-control"
        [class.is-invalid]="hasNameError"
        id="name"
        name="name"
        autocomplete="name"
        aria-describedby="name"
        required
        [ngModel]="model().name"
        [minlength]="1"
        [maxlength]="100"
        #name="ngModel"
      />

      @if (hasNameError) {
        <div class="invalid-feedback">Nome é obrigatório</div>
      }
    </div>

    <!-- [] property binding -->
    @let hasEmailError = !email.valid && email.touched;
    <div class="form-group mb-3 has-validation">
      <label for="email" class="form-label">Email address</label>
      <input
        type="email"
        placeholder="nome@gail.com"
        class="form-control"
        id="email"
        name="email"
        autocomplete="email"
        aria-describedby="email"
        required
        email
        #email="ngModel"
        [ngModel]="model().email"
        [class.is-invalid]="hasEmailError"
      />
      @if (hasEmailError) {
        <div class="invalid-feedback">E-mail inválido</div>
      }
    </div>

    <button
      type="submit"
      class="btn btn-primary"
      [class.btn-secondary]="!form.valid"
      [disabled]="!form.valid"
    >
      Submit
    </button>

    <!-- <app-form-debug [form]="form" /> -->
  </form>
</div>
