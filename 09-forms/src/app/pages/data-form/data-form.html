<div class="bg-secondary-subtle p-4">
  <form class="form-horizontal" [formGroup]="form()" (ngSubmit)="onSubmit()">
    <div class="form-group has-validation mb-3">
      <div class="col-sm-12">
        <label for="email" class="form-label">Name</label>
      </div>
      <div class="col-sm-12">
        <input
          type="text"
          placeholder="Name"
          class="form-control"
          id="name"
          name="name"
          autocomplete="name"
          aria-describedby="name"
          formControlName="name"
          [ngClass]="applyCSSError('name')"
        />

        <div
          app-field-control
          message="Name is invalid"
          [showError]="checkIsValidAndTouched('name')"
        ></div>
      </div>
    </div>

    <!-- [] property binding -->
    <div class="form-group mb-3 has-validation">
      <div class="col-sm-12">
        <label for="email" class="form-label">Email address</label>
      </div>
      <div class="col-sm-12">
        <input
          type="email"
          placeholder="nome@gmail.com"
          class="form-control"
          id="email"
          name="email"
          autocomplete="email"
          aria-describedby="email"
          formControlName="email"
          [ngClass]="applyCSSError('email')"
        />
        <div
          app-field-control
          message="E-mail is required"
          [showError]="checkIsValidAndTouched('email')"
        ></div>
        <div app-field-control message="E-mail is invalid" [showError]="!checkValidEmail()"></div>
      </div>
    </div>

    <!-- Form Group -->
    <div formGroupName="address">
      <div class="form-group row mb-3 has-validation">
        <div class="col-md-3">
          <label for="cep" class="form-label">CEP</label>
          <input
            type="text"
            placeholder="CEP"
            class="form-control"
            id="cep"
            name="cep"
            autocomplete="cep"
            aria-describedby="cep"
            [ngClass]="applyCSSError('address.cep')"
            formControlName="cep"
            (blur)="getCEP()"
          />

          <div
            app-field-control
            message="CEP is invalid"
            [showError]="checkIsValidAndTouched('address.cep')"
          ></div>
        </div>
        <div class="col-md-3">
          <label for="number" class="form-label">Number</label>
          <input
            type="text"
            placeholder="Number"
            class="form-control"
            id="number"
            name="number"
            autocomplete="number"
            aria-describedby="number"
            [ngClass]="applyCSSError('address.number')"
            formControlName="number"
          />

          <div
            app-field-control
            message="Number is invalid"
            [showError]="checkIsValidAndTouched('address.number')"
          ></div>
        </div>
        <div class="col-md-6">
          <label for="complement" class="form-label">Complement</label>
          <input
            type="text"
            placeholder="Complement"
            class="form-control"
            id="complement"
            autocomplete="complement"
            aria-describedby="complement"
            formControlName="complement"
          />
        </div>
      </div>
      <div class="form-group col-md-12 mb-3 has-validation">
        <label for="street" class="form-label">Street</label>
        <input
          type="text"
          placeholder="Street"
          class="form-control"
          id="street"
          name="street"
          autocomplete="street"
          aria-describedby="street"
          readonly
          [ngClass]="applyCSSError('address.street')"
          formControlName="street"
        />

        <div
          app-field-control
          message="Street is invalid"
          [showError]="checkIsValidAndTouched('address.street')"
        ></div>
      </div>

      <div class="form-group row mb-3 has-validation">
        <div class="col-md-5">
          <label for="neighborhood" class="form-label">Neighborhood</label>
          <input
            type="text"
            placeholder="Neighborhood"
            class="form-control"
            id="neighborhood"
            name="neighborhood"
            autocomplete="neighborhood"
            aria-describedby="neighborhood"
            readonly
            [ngClass]="applyCSSError('address.neighborhood')"
            formControlName="neighborhood"
          />

          <div
            app-field-control
            message="Neighborhood is invalid"
            [showError]="checkIsValidAndTouched('address.neighborhood')"
          ></div>
        </div>
        <div class="col-md-4">
          <label for="city" class="form-label">City</label>
          <input
            type="text"
            placeholder="City"
            class="form-control"
            id="city"
            autocomplete="city"
            aria-describedby="city"
            readonly
            [ngClass]="applyCSSError('address.city')"
            formControlName="city"
          />

          <div
            app-field-control
            message="City is invalid"
            [showError]="checkIsValidAndTouched('address.city')"
          ></div>
        </div>
        <div class="col-md-3">
          <label for="state" class="form-label">State</label>
          <select
            id="state"
            class="form-control"
            autocomplete="state"
            aria-describedby="state"
            [ngClass]="applyCSSError('address.state')"
            formControlName="state"
          >
            <option value="" disabled selected hidden>Estado</option>

            @for (state of states() | async; track state.id) {
              <option [value]="state.nome">
                {{ state.nome }}
              </option>
            }
          </select>

          <div
            app-field-control
            message="State is invalid"
            [showError]="checkIsValidAndTouched('address.state')"
          ></div>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-between">
      <button type="button" class="btn btn-secondary" (click)="reset()">Cancel</button>
      <button type="submit" class="btn btn-primary">Submit</button>
      <!-- <button type="submit" class="btn btn-primary" [disabled]="!form().valid">Submit</button> -->
    </div>
    <app-form-debug [form]="form()" />
  </form>
</div>
